name: knowledge-graph
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate knowledge graph
        run: uv run kg.py check
      - name: Generated output is up to date
        run: uv run kg.py fix -q && git diff --exit-code -- knowledge
      - name: Tests
        run: |
          uv run test_kg.py
          python3 test_profiles.py
