name: knowledge-graph
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # --locked: the scripts run with the versions in their *.py.lock files.
      - name: Validate knowledge graph
        run: uv run --locked kg.py check
      - name: Generated output is up to date
        run: uv run --locked kg.py fix -q && git diff --exit-code -- knowledge
      - name: Tests
        run: |
          uv run --locked test_kg.py
          python3 test_profiles.py

  lint:
    name: lint, format and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: ruff check
        run: uv run --no-project --with-requirements requirements-dev.txt ruff check .
      - name: ruff format --check
        run: uv run --no-project --with-requirements requirements-dev.txt ruff format --check .
      - name: mypy
        run: uv run --no-project --with-requirements requirements-dev.txt mypy
