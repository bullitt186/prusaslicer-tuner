<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Knowledge Graph</title>
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.43.5/dist/force-graph.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #fafaf8; --panel: #ffffff; --fg: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc; --edge: rgba(60,60,55,.22);
  --problem: #d1495b; --cause: #edae49; --procedure: #00798c; --material: #6a4c93; --component: #577590;
  --concept: #8d99ae; --key: #2a9d8f; --firmware_param: #e76f51; --hl: #1d1d1b;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141413; --panel: #1d1d1b; --fg: #ecebe6; --muted: #9b9a93; --line: #2e2d2a; --edge: rgba(220,220,210,.18); --hl: #fff;
}}
:root[data-theme="dark"] { --bg: #141413; --panel: #1d1d1b; --fg: #ecebe6; --muted: #9b9a93; --line: #2e2d2a; --edge: rgba(220,220,210,.18); --hl: #fff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
#app { display: grid; grid-template-columns: 1fr minmax(320px, 38%); height: 100vh; }
#graph { position: relative; overflow: hidden; }
#bar { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#bar input, #bar select, #bar button { font: inherit; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
#search { min-width: 180px; flex: 1 1 200px; max-width: 320px; }
#bar select { max-width: 170px; }
#results { position: absolute; top: 48px; left: 12px; z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-height: 50vh; overflow: auto; min-width: 260px; display: none; }
#results div { padding: 6px 10px; cursor: pointer; }
#results div:hover, #results div.sel { background: var(--line); }
#results small { color: var(--muted); }
#legend { position: absolute; bottom: 10px; left: 12px; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
#legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--c); vertical-align: -1px; }
#panel { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 18px 22px 40px; }
#panel h1 { font-size: 20px; margin: 0 0 2px; }
#panel .type { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
#panel .alt { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
#panel .rels { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 12px 0; font-size: 13px; }
#panel .rels b { display: block; margin-top: 6px; font-weight: 600; }
#panel a { color: var(--procedure); cursor: pointer; text-decoration: none; }
#panel a:hover { text-decoration: underline; }
#panel table { border-collapse: collapse; font-size: 12.5px; display: block; overflow-x: auto; }
#panel td, #panel th { border: 1px solid var(--line); padding: 3px 6px; vertical-align: top; }
#panel code { font-size: 12.5px; }
#panel .empty { color: var(--muted); margin-top: 30vh; text-align: center; }
@media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; } #panel { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <div id="graph">
    <div id="bar">
      <input id="search" placeholder="Search (stringing, Fädenziehen, retract…)" autocomplete="off" aria-label="Search concepts">
      <select id="ftype" aria-label="Filter by type"><option value="">All types</option></select>
      <select id="fmat" aria-label="Filter by material"><option value="">All materials</option></select>
      <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="fkeys"> settings</label>
      <button id="theme" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
    </div>
    <div id="results" role="listbox"></div>
    <div id="legend"></div>
    <div id="canvas"></div>
  </div>
  <aside id="panel"><div class="empty">Click a node or search to open a concept.</div></aside>
</div>
<script>
const DATA = /*__DATA__*/null;
const G = DATA.graph, BODIES = DATA.bodies;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const TYPES = ["problem","cause","procedure","material","component","concept","key","firmware_param"];
const PRED = {caused_by:["Caused by","Causes"], fixed_by:["Fixed by","Fixes"], prone_to:["Prone to","Materials prone to this"],
  calibrates:["Calibrates","Calibrated by"], broader:["Broader","Narrower"], related:["Related","Related"],
  overrides:["Overrides","Overridden by"], link:["Links to","Linked from"]};
const DASH = {caused_by:null, fixed_by:[4,2], prone_to:[1,2], calibrates:[6,3], broader:[2,2], related:[1,3], overrides:[6,2,1,2], link:[1,4]};
const norm = s => s.toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
  .normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/['’]/g,"").replace(/[^a-z0-9]+/g," ").trim();

// links between docs that are not typed edges (authored markdown links)
const linkEdges = [];
const linkRe = /\]\(([^)#\s]+\.md)/g;
for (const [id, body] of Object.entries(BODIES)) {
  const dir = id.split("/").slice(0,-1);
  for (const m of body.matchAll(linkRe)) {
    if (/^https?:/.test(m[1])) continue;
    const parts = [...dir];
    for (const p of m[1].replace(/\.md$/,"").split("/")) { if (p === "..") parts.pop(); else if (p !== ".") parts.push(p); }
    const t = parts.join("/");
    if (t !== id && G.nodes[t]) linkEdges.push({s:id, p:"link", o:t});
  }
}
const allEdges = [...G.edges.filter(e => e.o), ...linkEdges];
const typedPairs = new Set(G.edges.map(e => e.s+"|"+e.o));

function materialOf(id) { // materials a node is associated with (prone_to edges + when.material)
  const out = new Set();
  for (const e of G.edges) {
    if (e.p === "prone_to" && (e.o === id || e.s === id)) out.add(e.s);
    if (e.when && e.when.material && (e.s === id || e.o === id)) e.when.material.forEach(m => out.add(m));
  }
  if (G.nodes[id].type === "material") out.add(id);
  return out;
}

const ftype = document.getElementById("ftype"), fmat = document.getElementById("fmat"), fkeys = document.getElementById("fkeys");
TYPES.forEach(t => ftype.add(new Option(t.replace("_"," "), t)));
Object.entries(G.nodes).filter(([,n]) => n.type === "material").sort((a,b) => a[1].label.localeCompare(b[1].label))
  .forEach(([id,n]) => fmat.add(new Option(n.label, id)));
document.getElementById("legend").innerHTML = TYPES.map(t => `<span style="--c:var(--${t})">${t.replace("_"," ")}</span>`).join("");

let selected = null, hoverNode = null, fitted = false;
const neighbors = id => new Set(allEdges.flatMap(e => e.s === id ? [e.o] : e.o === id ? [e.s] : []));

function visible() {
  const t = ftype.value, m = fmat.value;
  let ids = Object.keys(G.nodes).filter(id => fkeys.checked || !["key","firmware_param"].includes(G.nodes[id].type));
  if (t) { // the chosen type plus its direct neighbours, so edges stay visible
    const base = ids.filter(id => G.nodes[id].type === t), keep = new Set(base);
    base.forEach(id => neighbors(id).forEach(x => keep.add(x)));
    ids = ids.filter(id => keep.has(id));
  }
  if (m) { ids = ids.filter(id => materialOf(id).has(m)); }
  return new Set(ids);
}

const graph = ForceGraph()(document.getElementById("canvas"))
  .nodeId("id").nodeLabel(n => `${n.label} · ${n.type}`)
  .nodeVal(n => 1 + Math.min(8, n.deg / 2))
  .linkLineDash(l => DASH[l.p]).linkDirectionalArrowLength(3).linkDirectionalArrowRelPos(1)
  .onNodeHover(n => { hoverNode = n ? n.id : null; document.body.style.cursor = n ? "pointer" : ""; })
  .onNodeClick(n => open(n.id))
  .cooldownTicks(120).onEngineStop(() => { if (!fitted) { fitted = true; graph.zoomToFit(400, 40); } })
  .nodeCanvasObject((n, ctx, scale) => {
    const r = Math.sqrt(1 + Math.min(8, n.deg / 2)) * 4;
    const focus = selected || hoverNode;
    const dim = focus && n.id !== focus && !neighbors(focus).has(n.id);
    ctx.globalAlpha = dim ? .15 : 1;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2*Math.PI); ctx.fillStyle = css("--" + n.type); ctx.fill();
    if (n.id === selected) { ctx.lineWidth = 2/scale; ctx.strokeStyle = css("--hl"); ctx.stroke(); }
    if (!dim && (scale > 1.6 || focus)) {
      ctx.font = `${11/scale}px system-ui`; ctx.fillStyle = css("--fg"); ctx.textAlign = "center";
      ctx.fillText(n.label, n.x, n.y + r + 10/scale);
    }
    ctx.globalAlpha = 1;
  })
  .linkColor(l => {
    const focus = selected || hoverNode;
    const s = l.source.id || l.source, o = l.target.id || l.target;
    return focus && s !== focus && o !== focus ? "rgba(128,128,128,.05)" : css("--edge");
  });

function refresh() {
  const vis = visible();
  const links = allEdges.filter(e => vis.has(e.s) && vis.has(e.o) && !(e.p === "link" && typedPairs.has(e.s+"|"+e.o)))
    .map(e => ({source: e.s, target: e.o, p: e.p}));
  const deg = {}; links.forEach(l => { deg[l.source] = (deg[l.source]||0)+1; deg[l.target] = (deg[l.target]||0)+1; });
  graph.graphData({nodes: [...vis].map(id => ({id, ...G.nodes[id], deg: deg[id]||0})), links});
}
[ftype, fmat, fkeys].forEach(el => el.addEventListener("change", refresh));
refresh();
new ResizeObserver(() => { const g = document.getElementById("graph"); graph.width(g.clientWidth).height(g.clientHeight); }).observe(document.getElementById("graph"));

// ---- panel ----
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nlink = id => G.nodes[id] ? `<a data-id="${esc(id)}">${esc(G.nodes[id].label)}</a>` : `<code>${esc(id)}</code>`;
const ARROW = {up:"↑", down:"↓", set:"=", enable:"on", disable:"off", check:"?"};
function qual(e) {
  const b = [];
  if (e.rank) b.push("#"+e.rank);
  if (e.evidence) b.push(e.evidence);
  if (e.when) Object.values(e.when).flat().forEach(w => b.push(String(w).split("/").pop()));
  if (e.action) b.push(esc(e.action));
  if (e.via) b.push("via " + nlink(e.via));
  let s = b.length ? ` <small>(${b.join("; ")})</small>` : "";
  (e.sets||[]).forEach(x => s += ` ${nlink(x.key)} ${ARROW[x.direction]||""}`);
  return s;
}
function open(id) {
  const n = G.nodes[id]; if (!n) return;
  selected = id;
  const groups = {};
  for (const e of G.edges) {
    if (e.s === id) (groups[PRED[e.p][0]] ||= []).push((e.o ? nlink(e.o) : "<i>settings</i>") + qual(e));
    else if (e.o === id) (groups[PRED[e.p][1]] ||= []).push(nlink(e.s) + qual(e));
  }
  for (const e of linkEdges) if (e.o === id && !typedPairs.has(e.s+"|"+e.o)) (groups["Linked from"] ||= []).push(nlink(e.s));
  const rels = Object.entries(groups).map(([k,v]) => `<b>${k}</b>${[...new Set(v)].join(" · ")}`).join("");
  const meta = [n.scope && `scope: ${n.scope}`, n.set_in && `set in: ${n.set_in}`].filter(Boolean).join(" · ");
  let body = BODIES[id] ? marked.parse(BODIES[id]) : "";
  document.getElementById("panel").innerHTML =
    `<div class="type">${esc(n.type.replace("_"," "))}${meta ? " · " + esc(meta) : ""}</div><h1>${esc(n.label)}</h1>` +
    (n.altLabel && n.altLabel.length ? `<div class="alt">also: ${n.altLabel.map(esc).join(", ")}</div>` : "") +
    (n.description ? `<p>${esc(n.description)}</p>` : "") +
    (n.check ? `<p><b>Check:</b> ${esc(n.check)}</p>` : "") +
    (rels ? `<div class="rels">${rels}</div>` : "") + body;
  document.getElementById("panel").scrollTop = 0;
  // rewrite relative .md links in the article to in-app navigation
  document.querySelectorAll("#panel a[href]").forEach(a => {
    const h = a.getAttribute("href");
    if (/^https?:/.test(h)) { a.target = "_blank"; a.rel = "noopener"; return; }
    if (!/\.md(#.*)?$/.test(h)) return;
    const parts = id.split("/").slice(0,-1);
    for (const p of h.replace(/#.*$/,"").replace(/\.md$/,"").split("/")) { if (p === "..") parts.pop(); else if (p !== ".") parts.push(p); }
    a.removeAttribute("href"); a.dataset.id = parts.join("/");
  });
  const node = graph.graphData().nodes.find(x => x.id === id);
  if (node && node.x !== undefined) { graph.centerAt(node.x, node.y, 600); graph.zoom(Math.max(graph.zoom(), 2.5), 600); }
  history.replaceState(null, "", "#" + encodeURIComponent(id));
}
document.getElementById("panel").addEventListener("click", ev => {
  const a = ev.target.closest("a[data-id]"); if (!a) return;
  ev.preventDefault();
  const id = a.dataset.id;
  if (["key","firmware_param"].includes((G.nodes[id]||{}).type) && !fkeys.checked) { fkeys.checked = true; refresh(); }
  open(id);
});

// ---- search over prefLabel + altLabel (same normalization as kg.py) ----
const search = document.getElementById("search"), results = document.getElementById("results");
let hits = [], sel = 0;
function draw() {
  results.style.display = hits.length ? "block" : "none";
  results.innerHTML = hits.map(([id, lab], i) => `<div class="${i===sel?"sel":""}" data-id="${esc(id)}">${esc(G.nodes[id].label)} <small>${esc(G.nodes[id].type)}${lab !== norm(G.nodes[id].label) ? " · " + esc(lab) : ""}</small></div>`).join("");
}
search.addEventListener("input", () => {
  const q = norm(search.value); sel = 0;
  if (!q) { hits = []; return draw(); }
  const seen = new Map();
  for (const [lab, ids] of Object.entries(G.aliases)) {
    if (!lab.includes(q)) continue;
    for (const id of ids) if (!seen.has(id) || lab === q) seen.set(id, lab);
  }
  hits = [...seen].sort((a,b) => (b[1]===q) - (a[1]===q) || a[1].length - b[1].length).slice(0, 12);
  draw();
});
search.addEventListener("keydown", ev => {
  if (ev.key === "ArrowDown") { sel = Math.min(sel+1, hits.length-1); draw(); ev.preventDefault(); }
  if (ev.key === "ArrowUp") { sel = Math.max(sel-1, 0); draw(); ev.preventDefault(); }
  if (ev.key === "Enter" && hits[sel]) pick(hits[sel][0]);
  if (ev.key === "Escape") { hits = []; draw(); }
});
results.addEventListener("click", ev => { const d = ev.target.closest("[data-id]"); if (d) pick(d.dataset.id); });
function pick(id) {
  hits = []; draw(); search.value = "";
  const t = G.nodes[id].type;
  if (["key","firmware_param"].includes(t) && !fkeys.checked) { fkeys.checked = true; }
  if (ftype.value && ftype.value !== t) ftype.value = "";
  fmat.value = ""; refresh();
  setTimeout(() => open(id), 50);
}

// ---- theme ----
document.getElementById("theme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("kg-theme", document.documentElement.dataset.theme); } catch (e) {}
});
try { const t = localStorage.getItem("kg-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

const start = decodeURIComponent(location.hash.slice(1));
if (start && G.nodes[start]) setTimeout(() => open(start), 300);
</script>
</body>
</html>
