# mypy (repo-kit CI standard, category 3): `uv run --no-project --with-requirements requirements-dev.txt mypy`
# Strict, except that functions without annotations are allowed: most of the scripts are not
# annotated yet. Annotate a function when you change it.
[mypy]
files = kg.py, profiles.py, server.py, test_kg.py, test_profiles.py, tests/test_scripts.py
python_version = 3.10
strict = True
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
# Values read from JSON and YAML are Any; returning them from typed helpers is intended.
warn_return_any = False
